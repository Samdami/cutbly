{% extends 'base.html' %}
{% block title %}Profile - Cutbly{% endblock %}
{% block content %}

<section class="pt-32 pb-24 bg-white">
  <div class="max-w-4xl mx-auto px-6">
    <div class="bg-white rounded-3xl shadow-lg p-8 border border-gray-200">
      <h1 class="text-4xl font-bold text-gray-900 mb-8">Welcome, {{ current_user.username|capitalize }}!</h1>
      
      <div class="space-y-6">
        <div class="border-b border-gray-200 pb-6">
          <h3 class="text-lg font-semibold text-gray-700 mb-2">Email Address</h3>
          <p class="text-gray-600">{{ current_user.email }}</p>
        </div>
        
        <div class="flex gap-4">
          <a href="{{ url_for('home') }}" class="btn-primary text-white px-6 py-3 rounded-full font-semibold hover:opacity-90 transition-opacity">Back to Dashboard</a>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
